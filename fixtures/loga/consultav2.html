<!DOCTYPE html>
<html>
<head>
    <title>LOGA - Consulta Coleta</title>
    <meta charset="UTF-8">
    <meta name="description" content="Consulta Coleta">
    <meta name="author" content="Clarify Sistemas">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="assets/bs4/css/bootstrap.min.css?v=v202606.1.0" rel="stylesheet">
    <link href="assets/css/index.css?v=v202606.1.0" rel="stylesheet">

    <script src="assets/js/jquery.min.js?v=v202606.1.0"></script>
    <script src="assets/bs4/js/bootstrap.bundle.min.js?v=v202606.1.0"></script>
</head>
<body>
    <div class="container" style="width: 100%; max-width: 100%; padding: 0px;">
        <div class="navi" id="map-canvas"></div>

        <!-- Legenda do Mapa -->
        <div id="map-legend" class="map-legend">
            <div class="legend-item">
                <img src="assets/img/ecobox-verde.png" class="legend-icon" alt="EcoBox" />
                <span class="legend-label">Ecobox</span>
            </div>
            <div class="legend-item">
                <img src="assets/img/ecobox-vidro.png" class="legend-icon" alt="EcoBox Vidro" />
                <span class="legend-label">Ecovidro</span>
            </div>
            <div class="legend-item">
                <img src="assets/img/uvr.png" class="legend-icon" alt="UVR" />
                <span class="legend-label">UVR</span>
            </div>
        </div>

        <div id="infoi" class="d-none d-sm-block">
            <div class="header-txt">
                <label class="header-lbl">Encontre o Horário de Coleta</label>
            </div>

            <div class="input-group">
                <input type="text" class="form-control theme-border-2" placeholder="Usar endereço + nº + bairro ou CEP" name="inputSearch" id="inputSearch">
                <div class="input-group-append">
                    <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="searchAddress($('#inputSearch').val(), false); return false;">
                        <img src="assets/img/search_white.svg" style="width: 18px; height: auto;">
                    </button>
                </div>
            </div>

            <div style="text-align: center; font-size: 12px; margin: 20px 0px">
                <p style="background: #ccc; height: 1px; margin: 0;">
                    <span style="position: relative; bottom: 10px; padding: 10px; background: #fff; color:#333">ou</span>
                </p>
            </div>

            <button type="button" class="btn btn-block" onclick="useMyLocation(false); return false;">
                <img src="assets/img/bussola_white.svg" style="height: 25px; width: auto; vertical-align: middle;" />
                <span style="vertical-align: middle;">Usar minha localização</span>
            </button>

            <div id="div-results"></div>

            <div style="bottom: 10px; position: absolute; width: 350px; text-align: center;">
                <a href="http://loga.com.br" class="btn btn-block btn-info">
                    Voltar
                </a>
            </div>

        </div>

        <div id="infoim" class="d-block d-sm-none">
            <div class="input-group mb-2 mt-2">
                <input type="text" class="form-control" placeholder="Usar endereço + nº + bairro ou CEP" name="inputSearchM" id="inputSearchM">
                <div class="input-group-append" style="background-color: #fff;">
                    <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="searchAddress($('#inputSearchM').val(), true); return false;">
                        <img src="assets/img/search_white.svg" style="width: 18px; height: auto;">
                    </button>
                    <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="useMyLocation(true); return false;">
                        <img src="assets/img/bussola_white.svg" style="height: 25px; width: auto; vertical-align: middle;" />
                    </button>
                </div>
            </div>
        </div>

        <div class="d-block d-sm-none" id="bottom-results">
            <div style="display: flex;">
                <img src="assets/img/logo.png" style="height: 40px; width: auto; vertical-align: middle;" />
                <div class="toggle-bar" onclick="showResultsMobile();"></div>
                <img id="btnToggleResult" src="assets/img/down.png" onclick="showResultsMobile();">
            </div>

            <div id="div-results-m">

            </div>
        </div>

    </div>

    <script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAOHrT1cLazDitIXsL9KLzpYBmVX4iXcdc&libraries=places"></script>
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
    <script src="assets/js/index.js?v=v202606.1.0"></script>
    <script src="assets/js/cf-error-handler.js?v=v202606.1.0"></script>
</body>
</html>
